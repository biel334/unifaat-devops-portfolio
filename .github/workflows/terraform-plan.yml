name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'aula-10/**.tf'
      - 'aula-10/**.tfvars'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: aula-10/terraform

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-10/terraform
    steps:
      - uses: actions/checkout@v4

      # Learner Lab: 3 credenciais temporárias de sessão (OIDC + role IAM não é possível no Lab)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color
        continue-on-error: true

      # Atualiza o comentário existente em vez de duplicar a cada push
      - name: Comentar plan no PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          PLAN_ERR: ${{ steps.plan.outputs.stderr }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- terraform-plan -->';
            let plan = process.env.PLAN || process.env.PLAN_ERR || '(sem output)';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncado)';
            const outcome = '${{ steps.plan.outcome }}';
            const body = `${marker}
            #### Terraform Plan 📖 — \`${outcome}\`

            <details><summary>Mostrar plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Autor: @${{ github.actor }} · Commit: \`${{ github.sha }}\`*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # PR não pode ser mergeado sem um plan válido
      - name: Falhar se o plan falhou
        if: steps.plan.outcome == 'failure'
        run: exit 1
