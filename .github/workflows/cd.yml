name: CD - Lint, Test, Build, Push (ECR) e Deploy

on:
  push:
    branches: [main]
    paths:
      - 'aula-10/technova-api/**'
      - '.github/workflows/cd.yml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: technova-api
  CONTAINER_NAME: technova-api
  APP_PORT: "3000"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-10/technova-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aula-10/technova-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-10/technova-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aula-10/technova-api/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  build-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (sessão do Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir imagem
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build (multi-stage) e push com tags SHA + latest
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" aula-10/technova-api
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na EC2 via SSH (Recreate) + health check
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GIT_SHA,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_DEFAULT_REGION,CONTAINER_NAME,APP_PORT
          script_stop: true
          script: |
            # 1) Login no ECR ANTES do pull (token expira)
            REGISTRY="${IMAGE%%/*}"
            aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            # 2) Recreate: pull -> stop -> rm -> run
            docker pull "$IMAGE"
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true
            docker run -d --name "$CONTAINER_NAME" --restart unless-stopped \
              -p "$APP_PORT:$APP_PORT" -e GIT_SHA="$GIT_SHA" "$IMAGE"

            # 3) Health check pós-deploy (até 2 min); falha o pipeline se não responder
            for i in $(seq 1 24); do
              if curl -fsS "http://localhost:$APP_PORT/health"; then
                echo ""
                echo "Health check OK (tentativa $i) — deploy do commit $GIT_SHA"
                exit 0
              fi
              echo "Tentativa $i/24 falhou, aguardando 5s..."
              sleep 5
            done
            echo "Health check FALHOU. Últimos logs do container:"
            docker logs --tail 50 "$CONTAINER_NAME"
            exit 1
